# Build the image, generate an SBOM, and block the pipeline on critical vulnerabilities.
# Every third-party action is pinned to a full commit SHA (checked by `make lint` / pinlint);
# the trailing comment records the human-readable release for Dependabot and reviewers.
name: image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sbom-scan:
    runs-on: ubuntu-latest
    env:
      IMAGE: secure-supply-chain:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image with Buildx
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          provenance: false # SLSA provenance is generated separately in M2
          tags: ${{ env.IMAGE }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}

      - name: Smoke-test the image
        run: |
          docker run -d --name app -p 8080:8080 "$IMAGE"
          for i in $(seq 1 20); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS localhost:8080/version | tee version.json
          grep -q "$GITHUB_SHA" version.json
          docker rm -f app

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Scan SBOM with Grype (fail on critical)
        id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom.spdx.json
          fail-build: true
          severity-cutoff: critical
          output-format: json
          output-file: grype.json

      - name: Summarise findings
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, collections, pathlib
          p = pathlib.Path("grype.json")
          if not p.exists():
              print("Grype produced no report."); raise SystemExit
          counts = collections.Counter(m["vulnerability"]["severity"] for m in json.loads(p.read_text())["matches"])
          print("| Severity | Count |\n|---|---|")
          for sev in ("Critical", "High", "Medium", "Low", "Negligible", "Unknown"):
              print(f"| {sev} | {counts.get(sev, 0)} |")
          EOF

      - name: Upload SBOM and scan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-and-scan
          path: |
            sbom.spdx.json
            grype.json
          if-no-files-found: warn
