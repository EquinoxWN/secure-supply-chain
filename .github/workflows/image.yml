# Build the image, generate an SBOM, and block the pipeline on critical vulnerabilities.
# Every third-party action is pinned to a full commit SHA (checked by `make lint` / pinlint);
# the trailing comment records the human-readable release for Dependabot and reviewers.
name: image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sbom-scan:
    runs-on: ubuntu-latest
    env:
      IMAGE: secure-supply-chain:${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image with Buildx
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          provenance: false # SLSA provenance is generated separately in M2
          tags: ${{ env.IMAGE }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}

      - name: Smoke-test the image
        run: |
          docker run -d --name app -p 8080:8080 "$IMAGE"
          for i in $(seq 1 20); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS localhost:8080/version | tee version.json
          grep -q "$GITHUB_SHA" version.json
          docker rm -f app

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Scan SBOM with Grype (fail on critical)
        id: grype
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6.5.1
        with:
          sbom: sbom.spdx.json
          fail-build: true
          severity-cutoff: critical
          output-format: json
          output-file: grype.json

      - name: Summarise findings
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, collections, pathlib
          p = pathlib.Path("grype.json")
          if not p.exists():
              print("Grype produced no report."); raise SystemExit
          counts = collections.Counter(m["vulnerability"]["severity"] for m in json.loads(p.read_text())["matches"])
          print("| Severity | Count |\n|---|---|")
          for sev in ("Critical", "High", "Medium", "Low", "Negligible", "Unknown"):
              print(f"| {sev} | {counts.get(sev, 0)} |")
          EOF

      - name: Upload SBOM and scan report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-and-scan
          path: |
            sbom.spdx.json
            grype.json
          if-no-files-found: warn
